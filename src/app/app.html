<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between px-4 sm:px-6">
    <a
      routerLink="/mediciones"
      class="flex items-center gap-2.5 rounded-lg text-lg font-semibold text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600"
    >
      <span
        class="grid size-9 place-items-center rounded-xl bg-emerald-600 text-white"
        aria-hidden="true"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="size-5"
        >
          <path d="M12 3c3.5 4.2 6 7.4 6 10.5a6 6 0 0 1-12 0C6 10.4 8.5 7.2 12 3Z" />
          <path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5" />
        </svg>
      </span>
      Grifo Asto
    </a>

    @if (autenticado()) {
      <div class="flex items-center gap-3">
        <span class="hidden max-w-56 truncate text-sm text-slate-600 sm:inline">
          {{ nombreUsuario() }}
        </span>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600"
        >
          Salir
        </button>
      </div>
    }
  </div>
</header>

<main class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6">
  <router-outlet />
</main>

@if (_alertService.isAlert()) {
  <tyn-alert [alertMenu]="_alertService.alertMenu()"> </tyn-alert>
}

<dialog id="my_modal_13" class="modal" #modalRef (click)="onDialogClick($event)">
  <div class="modal-box">
    <form method="dialog">
      <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
        ✕
      </button>
    </form>
    <h3 class="text-lg font-bold text-center">Eliminar!</h3>

    <svg
      class="h-[10em] m-auto text-red-400"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 640 640"
    >
      <path
        fill="red"
        d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"
      />
    </svg>

    <p class="py-4 text-center">¿Esta seguro que quiere eliminar?</p>
    <button
      type="button"
      class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2"
      (click)="closeDialog()"
    >
      ✕
    </button>
    <div class="flex justify-center mt-2 gap-2">
      <button type="button" class="btn btn-active btn-warning" (click)="closeDialog()">
        Cancelar
      </button>
      <button class="btn btn-active btn-accent text-white" (click)="confirm()">Aceptar</button>
    </div>
  </div>
</dialog>
